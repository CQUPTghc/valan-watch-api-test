[pytest]
testpaths = tests
addopts = -ra --assert=plain
markers =
    smoke: core login and read-only checks
    auth: authentication and authorization
    health: health profile and health metrics
    device: device state and device validation
    family: family relationships and grants
    app_version: Android version check
    user: personal profile and settings
    dashboard: home dashboard
    reports: health and third-party reports
    notifications: notification center
    ai: AI sessions, consent, and read-only history
    portrait: health portrait
    known_bug: previously confirmed backend defect; conditional xfail only when reproduced
    hardware: requires a physical test device or device synchronization
    external: requires a third-party service or media
    manual: cannot currently be run as a deterministic API check
    slow: long-running check
    destructive: changes relations or shared server state
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %H:%M:%S
